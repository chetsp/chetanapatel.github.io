name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Select GitHub Actions as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow --silent; then
            echo "::warning::Select Settings > Pages > Source > GitHub Actions to prevent the legacy branch deployment from overwriting this site."
          fi
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /chetanapatel.github.io
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
